name: PhraseKeyIOS
options:
  bundleIdPrefix: com.phrasekey
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    # 免费 Apple ID Personal Team（Kurt Gibson / kimliu2@yahoo.com）
    # 换人签名时改成自己的 Team ID：Xcode → Settings → Accounts 查看
    DEVELOPMENT_TEAM: "63PZWHLKMU"

targets:
  # 键盘扩展：复用桌面端引擎（纯 Foundation，无 AppKit）
  PhraseKeyKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: PhraseKeyKeyboard
      - path: ../Sources/PhraseKeyIME/Engine
      - path: ../Sources/PhraseKeyIME/Hotwords
      - path: ../Sources/PhraseKeyIME/Settings/InputScheme.swift
      - path: ../Sources/PhraseKeyIME/Settings/PhraseKeySettings.swift
      # 引擎资源：键盘扩展用移动版精简词库（3 万条）。
      # 实测（Scripts/bench_engine.sh + /tmp/mt2）：20 万条净增 93MB，6 万条 20MB，3 万条 10.6MB。
      # iOS 键盘扩展内存预算约 30-60MB，全量词库必被系统终止，故必须用 dict_mobile。
      # 打包时重命名为 dict.tsv，引擎按固定名加载，无需分平台改代码。
      - path: ../Sources/PhraseKeyIME/Resources/dict_mobile.tsv
        buildPhase: resources
      - path: ../Sources/PhraseKeyIME/Resources/hanzi_pinyin.tsv
        buildPhase: resources
    info:
      path: PhraseKeyKeyboard/Info.plist
      properties:
        CFBundleDisplayName: PhraseKey
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionAttributes:
            # PrimaryLanguage 是键盘扩展的必需键。缺失时系统无法确定该键盘的语言归属，
            # 注册进输入模式列表后拉起扩展进程会失败（表现：设置里能看到、切过去不出现/闪）。
            # 已由对照实验确认：空壳键盘 BareKB 带这三个键可长期存活，本键盘原先三键全缺。
            PrimaryLanguage: zh-Hans
            IsASCIICapable: false
            PrefersRightToLeft: false
            # RequestsOpenAccess=false：本键盘不联网、不读剪贴板、词库随包内置，无需完全访问。
            RequestsOpenAccess: false
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phrasekey.ime.keyboard
        PRODUCT_NAME: PhraseKeyKeyboard
        # 关闭 Debug Dylib：保守设置，让主类符号确定留在主可执行内。
        # 注：曾推测"带 debug.dylib 会导致键盘加载失败"，已被对照实验证伪——
        # 对照组 BareKB 带着 debug.dylib + __preview.dylib 仍长期存活。
        # 保留 NO 只是为了减少变量，不是因为它是死因。
        ENABLE_DEBUG_DYLIB: NO
        CODE_SIGN_ENTITLEMENTS: PhraseKeyKeyboard/PhraseKeyKeyboard.entitlements

  # 宿主 App：引导启用 + 数据预览（嵌入键盘扩展）
  PhraseKeyHost:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: PhraseKeyHost
      - path: ../Sources/PhraseKeyIME/Engine
      - path: ../Sources/PhraseKeyIME/Hotwords
      - path: ../Sources/PhraseKeyIME/Settings/InputScheme.swift
      - path: ../Sources/PhraseKeyIME/Settings/PhraseKeySettings.swift
      - path: ../Sources/PhraseKeyIME/Resources/dict.tsv
        buildPhase: resources
      - path: ../Sources/PhraseKeyIME/Resources/hanzi_pinyin.tsv
        buildPhase: resources
      - path: ../BrandAssets/PhraseKey.svg
        buildPhase: resources
    dependencies:
      - target: PhraseKeyKeyboard
        embed: true
    info:
      path: PhraseKeyHost/Info.plist
      properties:
        CFBundleDisplayName: PhraseKey
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phrasekey.ime
        PRODUCT_NAME: PhraseKey
        CODE_SIGN_ENTITLEMENTS: PhraseKeyHost/PhraseKeyHost.entitlements

  # UI 测试：验证键盘扩展在系统设置中的注册状态（诊断用）
  PhraseKeyKeyboardUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: PhraseKeyKeyboardUITests
    dependencies:
      - target: PhraseKeyHost
    settings:
      base:
        TEST_TARGET_NAME: PhraseKeyHost
        PRODUCT_BUNDLE_IDENTIFIER: com.phrasekey.ime.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PhraseKeyHost:
    build:
      targets:
        PhraseKeyHost: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PhraseKeyKeyboardUITests
