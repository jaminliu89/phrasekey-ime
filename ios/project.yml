name: PhraseKeyIOS
options:
  bundleIdPrefix: com.phrasekey
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    # 免费 Apple ID Personal Team（Kurt Gibson / kimliu2@yahoo.com）
    # 换人签名时改成自己的 Team ID：Xcode → Settings → Accounts 查看
    DEVELOPMENT_TEAM: "63PZWHLKMU"

targets:
  # 键盘扩展：复用桌面端引擎（纯 Foundation，无 AppKit）
  PhraseKeyKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: PhraseKeyKeyboard
      - path: ../Sources/PhraseKeyIME/Engine
      - path: ../Sources/PhraseKeyIME/Hotwords
      - path: ../Sources/PhraseKeyIME/Settings/InputScheme.swift
      - path: ../Sources/PhraseKeyIME/Settings/PhraseKeySettings.swift
      # 引擎资源（词库 + 汉字拼音表）
      - path: ../Sources/PhraseKeyIME/Resources/dict.tsv
        buildPhase: resources
      - path: ../Sources/PhraseKeyIME/Resources/hanzi_pinyin.tsv
        buildPhase: resources
    info:
      path: PhraseKeyKeyboard/Info.plist
      properties:
        CFBundleDisplayName: PhraseKey
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionAttributes:
            # 必须放在 NSExtensionAttributes 下，系统才会显示「允许完全访问」开关；
            # 键名必须是 RequestsOpenAccess（复数 Requests，少 s 系统不识别 = 开关不出现）
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phrasekey.ime.keyboard
        PRODUCT_NAME: PhraseKeyKeyboard
        # 关键：键盘扩展必须关闭 Debug Dylib（ENABLE_DEBUG_DYLIB）。
        # Debug 模式的 debug.dylib 会让主可执行变成 stub，符号不在里面，
        # 系统加载扩展时找不到 NSExtensionPrincipalClass → 键盘加载失败被跳过（真机表现为闪退）。
        ENABLE_DEBUG_DYLIB: NO

  # 宿主 App：引导启用 + 数据预览（嵌入键盘扩展）
  PhraseKeyHost:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: PhraseKeyHost
      - path: ../Sources/PhraseKeyIME/Engine
      - path: ../Sources/PhraseKeyIME/Hotwords
      - path: ../Sources/PhraseKeyIME/Settings/InputScheme.swift
      - path: ../Sources/PhraseKeyIME/Settings/PhraseKeySettings.swift
      - path: ../Sources/PhraseKeyIME/Resources/dict.tsv
        buildPhase: resources
      - path: ../Sources/PhraseKeyIME/Resources/hanzi_pinyin.tsv
        buildPhase: resources
      - path: ../BrandAssets/PhraseKey.svg
        buildPhase: resources
    dependencies:
      - target: PhraseKeyKeyboard
        embed: true
    info:
      path: PhraseKeyHost/Info.plist
      properties:
        CFBundleDisplayName: PhraseKey
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phrasekey.ime
        PRODUCT_NAME: PhraseKey

  # UI 测试：验证键盘扩展在系统设置中的注册状态（诊断用）
  PhraseKeyKeyboardUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: PhraseKeyKeyboardUITests
    dependencies:
      - target: PhraseKeyHost
    settings:
      base:
        TEST_TARGET_NAME: PhraseKeyHost
        PRODUCT_BUNDLE_IDENTIFIER: com.phrasekey.ime.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PhraseKeyHost:
    build:
      targets:
        PhraseKeyHost: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PhraseKeyKeyboardUITests
